# Docker-only development environment.
# The host has no Node/npm/pnpm — everything runs inside the `dev` container.

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: aioption-dev
    container_name: aioption-dev
    working_dir: /app
    volumes:
      # Live-mount the repository into the container.
      - .:/app
      # Persist the pnpm content-addressable store across container rebuilds,
      # so `pnpm install` stays fast after `docker compose up --build`.
      - pnpm-store:/root/.local/share/pnpm
    environment:
      NODE_ENV: development
    # Inject the repository's .env file into the container.
    env_file: .env
    ports:
      # Backend API (apps/server) — loopback only: this is a personal local app
      - '127.0.0.1:8080:8080'
      # Frontend dev server (apps/web) — loopback only
      - '127.0.0.1:5173:5173'
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]

volumes:
  pnpm-store:
